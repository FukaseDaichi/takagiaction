<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>TAKAGI ACTION</title>
	<style>
		div:last-child {color: #e90;}
		b{animation: r 1s infinite;}
		@keyframes r {50%{opacity:0;}}
		#c{width:100%;image-rendering:optimizeSpeed;image-rendering:pixelated;}
		#h{position:fixed;inset:0;background:url(m/hero.png) center/cover no-repeat;image-rendering:pixelated;animation:kb 30s ease-out forwards;transition:opacity 1s;}
		#h::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.45) 100%);}
		@keyframes kb{to{transform:scale(1.06);}}
		#a{font-weight:bold;color:#c80;position:absolute;top:4vw;left:2vw;font-size:1.6vw;overflow:hidden;white-space: nowrap;width:94%;text-shadow: 0 0 7px #f70;transition:opacity 1s;}
		#m{position:absolute;top:1.25vw;right:1.25vw;width:20vw;height:20vw;background:rgba(0,0,0,.7);border:0.3125vw solid #e90;image-rendering:optimizeSpeed;image-rendering:pixelated;display:none;}
		#sn{position:absolute;top:22.5vw;right:1.25vw;color:#e90;font-weight:bold;font-size:1.3vw;text-shadow:0 0 7px #f70;display:none;}
		#n{position:absolute;bottom:2vw;left:2vw;width:40vw;height:1.6vw;background:rgba(0,0,0,.7);border:0.3125vw solid #e90;display:none;}
		#nf{display:block;height:100%;width:100%;background:#e90;}
		#sp{position:absolute;bottom:2vw;left:45vw;color:#e90;font-weight:bold;font-size:1.3vw;text-shadow:0 0 7px #f70;display:none;}
		#b{position:absolute;left:0;top:0;padding:.3vw .7vw;background:rgba(0,0,0,.75);border:1px solid #e90;border-radius:.5vw;color:#e90;font-weight:bold;font-size:1.4vw;white-space:nowrap;opacity:0;transition:opacity .5s;pointer-events:none;}
		#b::after{content:'';position:absolute;left:50%;bottom:-.35vw;margin-left:-.35vw;border:.35vw solid transparent;border-bottom:0;border-top-color:#e90;}
		#b.tr{animation:tr .12s infinite;}
		@keyframes tr{25%{margin:-2px 0 0 1px;}75%{margin:2px 0 0 -1px;}}
	</style>
</head>
<body style="margin:0;background:#000">
	<canvas id="c" width=320 height=180></canvas>
	<div id="h"></div>
	<code id="a"></code>
	<canvas id="m" width=64 height=64></canvas>
	<code id="sn"></code>
	<div id="n"><i id="nf"></i></div>
	<code id="sp"></code>
	<code id="b"></code>
	<script type="module" src="/source/main.ts"></script>
</body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>TAKAGI ACTION</title>
	<style>
		div:last-child {color: #e90;}
		b{animation: r 1s infinite;}
		@keyframes r {50%{opacity:0;}}
		#c{width:100%;image-rendering:optimizeSpeed;image-rendering:pixelated;}
		#a{font-weight:bold;color:#c80;position:absolute;top:4vw;left:2vw;font-size:1.6vw;overflow:hidden;white-space: nowrap;width:94%;text-shadow: 0 0 7px #f70;transition:opacity 1s;}
		#m{position:absolute;top:1.25vw;right:1.25vw;width:20vw;height:20vw;background:rgba(0,0,0,.7);border:0.3125vw solid #e90;image-rendering:optimizeSpeed;image-rendering:pixelated;display:none;}
		#n{position:absolute;bottom:2vw;left:2vw;width:40vw;height:1.6vw;background:rgba(0,0,0,.7);border:0.3125vw solid #e90;display:none;}
		#nf{display:block;height:100%;width:100%;background:#e90;}
	</style>
</head>
<body style="margin:0;background:#000">
	<canvas id="c" width=320 height=180></canvas>
	<code id="a"></code>
	<canvas id="m" width=64 height=64></canvas>
	<div id="n"><i id="nf"></i></div>
	<script type="module" src="/source/main.ts"></script>
</body></html>
